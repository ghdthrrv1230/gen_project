<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신조어 탐구 생활 - 우리 팀 프로젝트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>신조어 문해력 테스트</h1>
        
        <div id="quiz-screen">
            <div class="progress">문제 <span id="current-idx">1</span> / <span id="total-idx">0</span></div>
            <h2 id="question-text">문제가 여기에 나타납니다.</h2>
            
            <div id="options-container">
                </div>

            <div class="evidence-area">
                <span class="hover-hint">💡 힌트/근거 보기 (마우스를 올리세요)</span>
                <div class="tooltip-box">
                    <strong id="evidence-title">논문 제목</strong>
                    <p id="evidence-desc">신조어 유래 및 통계 요약 내용</p>
                </div>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>테스트 결과</h2>
            <p id="score-text"></p>
            <button onclick="location.reload()">다시 하기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
